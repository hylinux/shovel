name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple   # 覆盖 pyproject 里的内网源

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # 主仓库放在 shovel/ 子目录
      - uses: actions/checkout@v5
        with:
          path: shovel

      # 同级 checkout 依赖仓库，使 ../py-generic-host 成立
      - uses: actions/checkout@v5
        with:
          repository: hylinux/py-generic-host
          ref: main            # 或固定 tag: v1.0.1
          path: py-generic-host

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "shovel/pyproject.toml"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        working-directory: shovel
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        working-directory: shovel
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        working-directory: shovel
        run: uv run mypy backend/src

      - name: Test (pytest)
        working-directory: shovel
        shell: bash
        run: |
          set +e
          uv run pytest
          code=$?
          set -e
          if [ $code -eq 5 ]; then
            echo "::warning::No tests collected."
          elif [ $code -ne 0 ]; then
            exit $code
          fi

      - name: Build (smoke)
        working-directory: shovel
        run: uv build

      - uses: actions/upload-artifact@v5
        with:
          name: dist-preview
          path: shovel/dist/
          retention-days: 7