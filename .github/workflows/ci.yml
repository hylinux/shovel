name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-outlook:
    runs-on: windows-latest
    needs: [windows-wam, quality]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: enterprise-native-candidate
          path: .tools/enterprise-native
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.14 x64
        run: uv python install 3.14-x86_64
      - name: Sync Windows dependencies
        run: uv sync --python 3.14-x86_64 --locked --all-extras
      - name: Type check Windows target including native private IPC
        run: >-
          uv run --no-sync mypy --platform win32
          backend\src scripts\enterprise_acceptance.py scripts\smoke_enterprise_wheel.py
          scripts\build_controlled_installation.py
      - name: Exercise Outlook contracts and shared pipeline without a mailbox
        run: >-
          uv run --locked pytest --no-cov
          --junitxml=.tools/windows-contracts.xml
          backend\tests\test_outlook.py
          backend\tests\test_parsers.py
          backend\tests\test_chunker.py
          backend\tests\test_scan_pipeline.py
          backend\tests\test_native_wam.py
          backend\tests\test_controlled_installation.py
      - name: Collect sanitized private-pipe acceptance evidence
        run: >-
          uv run --no-sync python scripts\enterprise_acceptance.py collect
          --lane windows_ipc --report .tools\windows-contracts.xml
          --artifact native_bundle=.tools\enterprise-native\shovel-wam-candidate.zip
          --output .tools\enterprise-evidence\windows-ipc.json
      - uses: actions/upload-artifact@v5
        with:
          name: enterprise-windows-evidence
          path: .tools/enterprise-evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v5
        with:
          name: dist-preview
          path: .tools/installation-wheel
      - name: Assemble complete offline installation candidate without provisioning trust
        shell: pwsh
        run: |
          Expand-Archive .tools\enterprise-native\shovel-wam-candidate.zip .tools\installation-native
          uv venv .tools\installation-env --python 3.14-x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:UV_PROJECT_ENVIRONMENT = ".tools\installation-env"
          uv sync --locked --extra outlook --no-dev --no-editable --no-install-project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:\UV_PROJECT_ENVIRONMENT
          $wheel = (Get-ChildItem .tools\installation-wheel -Filter *.whl).FullName
          uv pip install --python .tools\installation-env\Scripts\python.exe --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonHome = & .tools\installation-env\Scripts\python.exe -I -S -B -c "import sys; print(sys.base_prefix)"
          $expiry = [DateTimeOffset]::UtcNow.AddDays(1).ToUnixTimeSeconds()
          uv run --no-sync python scripts\build_controlled_installation.py `
            --python-home $pythonHome --site-packages .tools\installation-env\Lib\site-packages `
            --native .tools\installation-native --wheel $wheel --lock uv.lock `
            --output .tools\installation-candidate --install-root "C:\Program Files\Shovel\packages\1" `
            --revision 1 --valid-until $expiry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .tools\installation-native\Shovel.Wam.exe deployment inventory `
            .tools\installation-candidate\installation-payload.json .tools\installation-candidate\payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = (Resolve-Path .tools\installation-candidate\payload).Path
          & "$root\python\python.exe" -I -S -B -c `
            "import json,os,sys; from pathlib import Path; root=Path(r'$root'); m=json.loads((root.parent/'installation-payload.json').read_text()); sys.path[:]=[str(root/p) for p in m['modulePaths']]; handles=[os.add_dll_directory(str(root/p)) for p in m['runtime']['dllDirectories']]; import shovel,fastapi,zvec,sqlalchemy,win32com.client; from shovel.runtime.hosting import build_cli_host; print('isolated_runtime_imports_passed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .tools\installation-native\Shovel.Wam.exe deployment inventory `
            .tools\installation-candidate\installation-payload.json .tools\installation-candidate\payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive .tools\installation-candidate\* .tools\shovel-controlled-candidate.zip
      - uses: actions/upload-artifact@v5
        with:
          name: enterprise-controlled-candidate
          path: .tools/shovel-controlled-candidate.zip
          if-no-files-found: error
          retention-days: 7

  windows-wam:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: native
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native\global.json
      - name: Restore locked native dependencies
        run: dotnet restore Shovel.Wam.Tests\Shovel.Wam.Tests.csproj --configfile NuGet.Config --locked-mode
      - name: Check native formatting
        run: |
          dotnet format Shovel.Wam\Shovel.Wam.csproj --no-restore --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format Shovel.Wam.Tests\Shovel.Wam.Tests.csproj --no-restore --verify-no-changes
      - name: Build and test without authentication
        run: >-
          dotnet test Shovel.Wam.Tests\Shovel.Wam.Tests.csproj --no-restore -c Release
          --logger "trx;LogFileName=wam.trx" --results-directory ..\.tools\enterprise-native-tests
      - name: Check platform metadata without account or token calls
        run: |
          $json = dotnet run --project Shovel.Wam\Shovel.Wam.csproj --no-build -c Release -- check
          $code = $LASTEXITCODE
          $receipt = $json | ConvertFrom-Json
          if ($code -notin @(0, 3) -or $receipt.status -notin @("success", "unavailable") -or
              $receipt.scope -ne "standalone_wam" -or $receipt.production_ready -or
              $receipt.live_acceptance_complete) {
            throw "Unexpected WAM platform-check receipt."
          }
          exit 0
      - name: Restore locked self-contained Windows Desktop runtime
        run: >-
          dotnet restore Shovel.Wam\Shovel.Wam.csproj --configfile NuGet.Config
          --locked-mode --runtime win-x64 -p:SelfContained=true
      - name: Publish unsigned self-contained component candidate, not an installed Host
        run: |
          dotnet publish Shovel.Wam\Shovel.Wam.csproj --no-restore -c Release --runtime win-x64 --self-contained true -o ..\.tools\wam-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ..\.tools\enterprise-native | Out-Null
          Compress-Archive -Path ..\.tools\wam-candidate\* -DestinationPath ..\.tools\enterprise-native\shovel-wam-candidate.zip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare locked evidence collector
        working-directory: .
        run: uv sync --python 3.14-x86_64 --locked --all-extras
      - name: Collect sanitized native acceptance evidence
        working-directory: .
        run: >-
          uv run --no-sync python scripts\enterprise_acceptance.py collect
          --lane native_contracts --report .tools\enterprise-native-tests\wam.trx
          --artifact native_bundle=.tools\enterprise-native\shovel-wam-candidate.zip
          --output .tools\enterprise-native\native-contracts.json
      - uses: actions/upload-artifact@v5
        with:
          name: enterprise-native-candidate
          path: .tools/enterprise-native/*
          if-no-files-found: error
          retention-days: 7

  quality:
    runs-on: ubuntu-24.04
    steps:
      # 主仓库放在 shovel/ 子目录
      - uses: actions/checkout@v5
        with:
          path: shovel

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "shovel/uv.lock"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        working-directory: shovel
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        working-directory: shovel
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        working-directory: shovel
        run: >-
          uv run mypy backend/src scripts/enterprise_acceptance.py scripts/smoke_enterprise_wheel.py
          scripts/build_controlled_installation.py

      - name: Test (pytest)
        working-directory: shovel
        run: uv run pytest --junitxml=.tools/enterprise-python.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shovel/frontend/package-lock.json

      - name: Validate and bundle workbench
        working-directory: shovel/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
          mkdir -p ../backend/src/shovel/static
          cp -R out/. ../backend/src/shovel/static/

      - name: Build (smoke)
        working-directory: shovel
        run: uv build

      - name: Install wheel and exercise packaged runtime
        working-directory: shovel
        run: |
          uv venv .tools/package-smoke --python 3.14
          UV_PROJECT_ENVIRONMENT=.tools/package-smoke \
            uv sync --locked --no-dev --no-editable --no-install-project
          uv pip install --python .tools/package-smoke/bin/python \
            --no-deps dist/*.whl
          .tools/package-smoke/bin/python -m scripts.smoke_enterprise_wheel \
            --wheel dist/*.whl --output .tools/enterprise-evidence/installed-wheel.json

      - name: Collect sanitized portable acceptance evidence
        working-directory: shovel
        run: >-
          uv run --no-sync python scripts/enterprise_acceptance.py collect
          --lane python_contracts --report .tools/enterprise-python.xml
          --artifact "python_wheel=$(echo dist/*.whl)"
          --output .tools/enterprise-evidence/python-contracts.json

      - uses: actions/upload-artifact@v5
        with:
          name: enterprise-python-evidence
          path: shovel/.tools/enterprise-evidence/*.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v5
        with:
          name: dist-preview
          path: shovel/dist/
          retention-days: 7

  enterprise-provenance:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, windows-wam, windows-outlook]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist-preview
          path: candidate/python
      - uses: actions/download-artifact@v5
        with:
          name: enterprise-native-candidate
          path: candidate/native
      - uses: actions/download-artifact@v5
        with:
          name: enterprise-python-evidence
          path: candidate/evidence/python
      - uses: actions/download-artifact@v5
        with:
          name: enterprise-windows-evidence
          path: candidate/evidence/windows
      - uses: actions/download-artifact@v5
        with:
          name: enterprise-controlled-candidate
          path: candidate/controlled
      - name: Attest candidate bytes and offline receipts, not live acceptance
        uses: actions/attest@v4
        with:
          subject-path: |
            candidate/python/*.whl
            candidate/native/*.zip
            candidate/native/*.json
            candidate/evidence/python/*.json
            candidate/evidence/windows/*.json
            candidate/controlled/*.zip