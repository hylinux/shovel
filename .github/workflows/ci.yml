name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-outlook:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.14 x64
        run: uv python install 3.14-x86_64
      - name: Sync Windows dependencies
        run: uv sync --python 3.14-x86_64 --locked --all-extras
      - name: Exercise Outlook contracts and shared pipeline without a mailbox
        run: >-
          uv run --locked pytest --no-cov
          backend\tests\test_outlook.py
          backend\tests\test_parsers.py
          backend\tests\test_chunker.py
          backend\tests\test_scan_pipeline.py

  windows-wam:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: native
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native\global.json
      - name: Restore locked native dependencies
        run: dotnet restore Shovel.Wam.Tests\Shovel.Wam.Tests.csproj --configfile NuGet.Config --locked-mode
      - name: Check native formatting
        run: |
          dotnet format Shovel.Wam\Shovel.Wam.csproj --no-restore --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format Shovel.Wam.Tests\Shovel.Wam.Tests.csproj --no-restore --verify-no-changes
      - name: Build and test without authentication
        run: dotnet test Shovel.Wam.Tests\Shovel.Wam.Tests.csproj --no-restore -c Release
      - name: Check platform metadata without account or token calls
        run: |
          $json = dotnet run --project Shovel.Wam\Shovel.Wam.csproj --no-build -c Release -- check
          $code = $LASTEXITCODE
          $receipt = $json | ConvertFrom-Json
          if ($code -notin @(0, 3) -or $receipt.status -notin @("success", "unavailable") -or
              $receipt.scope -ne "standalone_wam" -or $receipt.production_ready -or
              $receipt.live_acceptance_complete) {
            throw "Unexpected WAM platform-check receipt."
          }
          exit 0

  quality:
    runs-on: ubuntu-latest
    steps:
      # 主仓库放在 shovel/ 子目录
      - uses: actions/checkout@v5
        with:
          path: shovel

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "shovel/uv.lock"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        working-directory: shovel
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        working-directory: shovel
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        working-directory: shovel
        run: uv run mypy backend/src

      - name: Test (pytest)
        working-directory: shovel
        run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shovel/frontend/package-lock.json

      - name: Validate and bundle workbench
        working-directory: shovel/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          mkdir -p ../backend/src/shovel/static
          cp -R out/. ../backend/src/shovel/static/

      - name: Build (smoke)
        working-directory: shovel
        run: uv build

      - name: Install wheel and exercise packaged runtime
        working-directory: shovel
        run: |
          uv venv .tools/package-smoke --python 3.14
          uv pip install --python .tools/package-smoke/bin/python dist/*.whl
          .tools/package-smoke/bin/python scripts/smoke_wheel.py

      - uses: actions/upload-artifact@v5
        with:
          name: dist-preview
          path: shovel/dist/
          retention-days: 7