name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # 主仓库放在 shovel/ 子目录
      - uses: actions/checkout@v5
        with:
          path: shovel

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "shovel/uv.lock"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        working-directory: shovel
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        working-directory: shovel
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        working-directory: shovel
        run: uv run mypy backend/src

      - name: Test (pytest)
        working-directory: shovel
        run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shovel/frontend/package-lock.json

      - name: Validate and bundle workbench
        working-directory: shovel/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          mkdir -p ../backend/src/shovel/static
          cp -R out/. ../backend/src/shovel/static/

      - name: Build (smoke)
        working-directory: shovel
        run: uv build

      - name: Install wheel and exercise packaged runtime
        working-directory: shovel
        run: |
          uv venv .tools/package-smoke --python 3.14
          uv pip install --python .tools/package-smoke/bin/python dist/*.whl
          .tools/package-smoke/bin/python scripts/smoke_wheel.py

      - uses: actions/upload-artifact@v5
        with:
          name: dist-preview
          path: shovel/dist/
          retention-days: 7