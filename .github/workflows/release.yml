name: Release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.5)
        required: true
        type: string

permissions:
  contents: write     # 创建 Release 所需，无需任何 Secret

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: shovel
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      # tag 必须与 pyproject 的 version 一致
      - name: Check tag matches project version
        working-directory: shovel
        shell: bash
        run: |
          TAG="${RELEASE_TAG#v}"
          VER=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG  project=$VER"
          test "$RELEASE_TAG" = "v$VER" || { echo "::error::tag $RELEASE_TAG != v$VER"; exit 1; }

      - name: Run tests before release
        working-directory: shovel
        run: |
          uv sync --locked --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy backend/src
          uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shovel/frontend/package-lock.json

      - name: Build and bundle static workbench
        working-directory: shovel/frontend
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          mkdir -p ../backend/src/shovel/static
          cp -R out/. ../backend/src/shovel/static/

      - name: Build distributions
        working-directory: shovel
        run: uv build

      - name: Validate installed release wheel
        working-directory: shovel
        run: |
          uv venv .tools/package-smoke --python 3.14
          UV_PROJECT_ENVIRONMENT=.tools/package-smoke \
            uv sync --locked --no-dev --no-editable --no-install-project
          uv pip install --python .tools/package-smoke/bin/python \
            --no-deps dist/*.whl
          .tools/package-smoke/bin/python scripts/smoke_wheel.py

      - name: List artifacts
        working-directory: shovel
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            shovel/dist/*.whl
            shovel/dist/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'rc') || contains(env.RELEASE_TAG, 'beta') }}