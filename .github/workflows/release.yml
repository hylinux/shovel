name: Release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write     # 创建 Release 所需，无需任何 Secret

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: shovel
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hylinux/py-generic-host
          ref: main
          path: py-generic-host

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      # tag 必须与 pyproject 的 version 一致
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: shovel
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG  project=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != pyproject version $VER"; exit 1; }

      - name: Run tests before release
        working-directory: shovel
        shell: bash
        run: |
          uv sync --all-extras --dev
          set +e
          uv run pytest
          code=$?
          set -e
          if [ $code -eq 5 ]; then
            echo "::warning::No tests collected, skipping test gate."
          elif [ $code -ne 0 ]; then
            exit $code
          fi

      - name: Build distributions
        working-directory: shovel
        run: uv build

      - name: List artifacts
        working-directory: shovel
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            shovel/dist/*.whl
            shovel/dist/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}